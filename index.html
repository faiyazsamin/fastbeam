<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fastbeam — files to the next device, straight across</title>
    <meta
      name="description"
      content="Send files and text between your devices straight from the browser. Same Wi‑Fi: they find each other. Anywhere else: a six-letter code. No app, no account, no cloud; every byte goes device to device, encrypted."
    />
    <link rel="canonical" href="https://fastbeam.app/" />
    <meta name="application-name" content="fastbeam" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="keywords"
      content="file sharing, send files between devices, phone to laptop, local file transfer, browser file transfer, WebRTC, peer to peer, AirDrop alternative, LocalSend web"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fastbeam" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://fastbeam.app/" />
    <meta property="og:title" content="fastbeam — files to the next device, straight across" />
    <meta
      property="og:description"
      content="Send files and text between your devices from the browser. No app, no account, no cloud. Open fastbeam.app on both devices."
    />
    <meta property="og:image" content="https://fastbeam.app/og.png" />
    <meta property="og:image:secure_url" content="https://fastbeam.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="fastbeam logo with the line: Files to the next device, straight across." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fastbeam — files to the next device, straight across" />
    <meta
      name="twitter:description"
      content="Send files and text between your devices from the browser. No app, no account, no cloud."
    />
    <meta name="twitter:image" content="https://fastbeam.app/og.png" />
    <meta name="twitter:image:alt" content="fastbeam logo with the line: Files to the next device, straight across." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "fastbeam",
        "url": "https://fastbeam.app/",
        "description": "Send files and text between your devices straight from the browser. Devices on the same Wi‑Fi find each other; anywhere else a six-letter code pairs them. No app, no account, no cloud.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with WebRTC",
        "image": "https://fastbeam.app/og.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Automatic discovery on the same Wi‑Fi",
          "Pair across networks with a code, link or QR",
          "Direct, encrypted device-to-device transfer",
          "Optional password-protected pairing",
          "Installable, works offline after first load"
        ]
      }
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B7F80" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="fastbeam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <script>
      // Apply a forced theme before first paint so a Dark/Light setting never flashes.
      try {
        var t = JSON.parse(localStorage.getItem('fastbeam:theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
